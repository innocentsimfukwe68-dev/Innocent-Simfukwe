<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cosmeticsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#cosmeticsGrad)" />
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="190" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" fill="none" />

  <!-- Perfume / Lotion Bottle Base -->
  <rect x="176" y="210" width="160" height="190" rx="36" fill="#ffffff" fill-opacity="0.95" />
  
  <!-- Bottle Neck -->
  <rect x="232" y="160" width="48" height="50" rx="8" fill="url(#goldGrad)" />
  
  <!-- Golden Atomizer / Spray Cap -->
  <path d="M216 160 C216 130, 296 130, 296 160 Z" fill="url(#goldGrad)" />
  
  <!-- Sparkles / Cosmetics Shine -->
  <path d="M350 140 L356 160 L376 166 L356 172 L350 192 L344 172 L324 166 L344 160 Z" fill="#fef08a" />
  <path d="M140 280 L144 294 L158 298 L144 302 L140 316 L136 302 L122 298 L136 294 Z" fill="#ffffff" fill-opacity="0.8" />
  
  <!-- Label on Bottle -->
  <rect x="200" y="260" width="112" height="70" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2" />
  <text x="256" y="295" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#be123c" text-anchor="middle">SHOP</text>
  <text x="256" y="315" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">POS &amp; STOO</text>
</svg>
